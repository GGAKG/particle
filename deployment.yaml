apiVersion: apps/v1
kind: Deployment
metadata:
  name: time-app
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: time-app
  template:
    metadata:
      labels:
        app: time-app
    spec:
      containers:
      - name: time-app
        image: docker.io/ggakg/my-node-app:latest
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /app/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: time-app
  namespace: app
spec:
  type: ClusterIP
  selector:
    app: time-app
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: time-app-ingress
  namespace: app
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /app
        pathType: Prefix
        backend:
          service:
            name: time-app
            port:
              number: 80

